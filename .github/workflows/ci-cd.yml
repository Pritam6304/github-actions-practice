name: CI-CD Pipeline Example

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Always runs on push/PR, but contains step-level checks
  # -------------------------------------------------------------
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Linter
        run: echo "Linting code..."

      - name: Run Tests
        run: echo "Running test suite..."

      # STEP-LEVEL IF: Only runs on the main branch
      - name: Notify Slack on Main Branch
        if: github.ref == 'refs/heads/main'
        run: echo "Sending notification for main branch push..."

      # STEP-LEVEL IF: Runs ONLY if a previous step in this job failed
      - name: Report Failure Debug Info
        if: failure()
        run: echo "A step failed! Gathering logs..."

  # -------------------------------------------------------------
  # JOB 2: JOB-LEVEL IF - Only runs if Job 1 succeeded AND branch is main
  # -------------------------------------------------------------
  deploy-production:
    needs: test-and-lint
    # JOB-LEVEL IF: Evaluated BEFORE allocating an ubuntu runner
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Cloud
        run: echo "Deploying application to production server..."
